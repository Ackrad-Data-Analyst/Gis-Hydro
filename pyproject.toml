[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-hydrology-workflow"
version = "0.1.0"
description = "Site-agnostic preliminary hydrology workflow automation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
site-hydro = "hydro_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
