[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cygnus-hydrology-prototype"
version = "0.1.0"
description = "Read-only preliminary hydrology project intake prototype"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cygnus-hydro = "hydro_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
